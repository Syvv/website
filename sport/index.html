<html>
    <head>
        <title>Syvv (Sportstables)</title>
        <link rel="stylesheet" type="text/css" href="../style/main.css">
        <script type="module" src="script.js"></script>
    </head>
    <body>
        <div class="Customisation">
            <span>
                <label for="competition">Competition:</label>
                <select name="competition" id="competitionSelector">
                    <option value="curlingWomenOlympic">Curling Women 2026 Olympic Games</option>
                    <option value="eredivisie">Eredivisie 25/26</option>
                </select>
            </span>
            <span class="switch-input">
                <label class="switch">
                    <input type="checkbox" id="useSameSizeFlags">
                    <span class="slider round"></span>
                </label>
                <span class="text">Use same size flags</span>
            </span>
            <span class="switch-input">
                <label class="switch">
                    <input type="checkbox" id="useCompactTable">
                    <span class="slider round"></span>
                </label>
                <span class="text">Compact table</span>
            </span>
            <span class="switch-input">
                <label class="switch">
                    <input type="checkbox" id="displayPositions">
                    <span class="slider round"></span>
                </label>
                <span class="text">Display position numbers</span>
            </span>
        </div>
        
        <!-- Element which will become the table, the javascript will manage that for us -->
        <div id="sportsTable"></div>
    </body>
</html>
